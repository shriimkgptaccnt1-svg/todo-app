<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#d9480f">
<title>todo</title>
<style>
@font-face { font-family: "Figtree"; font-weight: 400; font-display: swap; src: url("fonts/figtree-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 500; font-display: swap; src: url("fonts/figtree-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: swap; src: url("fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: swap; src: url("fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 600; font-display: swap; src: url("fonts/bricolage-grotesque-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 700; font-display: swap; src: url("fonts/bricolage-grotesque-latin-700-normal.woff2") format("woff2"); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
<style>
/* Layout: one-screen app, dark by design. Coloured top bar (orange = short term, blue = long term, blending on swipe) over a black body; two panes in a horizontal snap track. Row: grip | age dot | task + due | done circle. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --card: #141417;
  --card-2: #1d1d22;
  --card-line: #24242a;
  --text: #ffffff;
  --muted: #9a9aa6;
  --now: #d9480f;
  --later: #3651cc;
  --head: #d9480f;
  --warn: #f0a429;
  --alert: #ff6464;
  --done: #1f9d55;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  overflow: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--head);
}
.app { height: calc(100% - var(--kb, 0px)); display: grid; grid-template-rows: auto 1fr; }

/* Top bar */
header { background: var(--head); color: #fff; }
.head-inner {
  max-width: 640px;
  margin: 0 auto;
  display: grid;
  gap: 12px;
  padding-block: 14px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 36px; height: 36px; flex: none; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.7rem;
  letter-spacing: -0.03em;
  line-height: 1;
}
.done-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 5px 5px;
  border-radius: 999px;
  background: rgba(0,0,0,.25);
  font-size: .85rem;
  font-weight: 600;
  white-space: nowrap;
}
.done-pill .num {
  display: grid;
  place-items: center;
  min-width: 26px;
  height: 26px;
  padding: 0 6px;
  border-radius: 999px;
  background: #fff;
  color: var(--head);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.done-pill.bump .num { animation: bump .4s ease; }
@keyframes bump { 40% { transform: scale(1.3); } }
.tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; }
.tab {
  appearance: none;
  background: none;
  border: 0;
  padding: 10px 4px 14px;
  font: 600 .88rem/1 var(--font-body);
  white-space: nowrap;
  color: rgba(255,255,255,.7);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.tab[aria-selected="true"] { color: #fff; }
.tab:focus-visible { outline: 2px solid #fff; outline-offset: -2px; border-radius: 6px; }
.count {
  min-width: 1.6em;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: .75rem;
  font-variant-numeric: tabular-nums;
  background: rgba(0,0,0,.22);
}
.tab[aria-selected="true"] .count { background: #fff; color: var(--head); }
.indicator {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 33.3333%;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: #fff;
}

/* Track */
.track {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  min-height: 0;
}
.track::-webkit-scrollbar { display: none; }
.track.locked { overflow-x: hidden; }
.pane {
  scroll-snap-align: start;
  scroll-snap-stop: always;
  min-height: 0;
  display: grid;
  grid-template-rows: 1fr auto;
  overflow: hidden;
}
.pane[data-list="short"] { --accent: var(--now); }
.pane[data-list="long"] { --accent: var(--later); }
.pane[data-list="done"] { --accent: var(--done); grid-template-rows: 1fr auto; }
.task.fresh { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
/* Done tab */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 12px 10px; text-align: center; display: grid; gap: 2px; }
.stat b { font: 700 1.6rem/1.1 var(--font-display); color: #fff; font-variant-numeric: tabular-nums; }
.stat:first-child b { color: #3ddc84; }
.stat span { font-size: .75rem; color: var(--muted); }
.day-head { display: flex; justify-content: space-between; align-items: baseline; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 4px 8px; }
.done-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.done-item { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--card-line); }
.done-item .tick { width: 26px; height: 26px; border-radius: 50%; background: var(--done); display: grid; place-items: center; }
.done-item .tick::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.done-item .dt { min-width: 0; display: grid; gap: 2px; }
.done-item .dt .text { overflow-wrap: anywhere; }
.done-item .meta { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.done-item .meta .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.done-item { grid-template-columns: 28px 1fr auto; padding: 8px 6px 8px 12px; }
.done-item.sel { border-color: var(--done); background: color-mix(in srgb, var(--done) 14%, var(--card)); }
.selbox { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #55555f; display: grid; place-items: center; }
.done-item.sel .selbox { background: var(--done); border-color: var(--done); }
.done-item.sel .selbox::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.selecting .done-item { cursor: pointer; }
.row-acts { display: flex; gap: 2px; }
.icon-btn {
  appearance: none; border: 0; background: transparent; color: var(--muted);
  width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; cursor: pointer;
}
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.restore { color: var(--now); }
.icon-btn.trash { color: #ff7b7b; }
.icon-btn:hover { background: var(--card-2); }
.icon-btn:focus-visible { outline: 2px solid #fff; }
.done-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px 4px; }
.done-tools .note { font-size: .78rem; color: var(--muted); }
.link-btn { appearance: none; border: 0; background: none; color: #fff; font: 600 .9rem var(--font-body); padding: 8px 4px; cursor: pointer; }
.link-btn:focus-visible { outline: 2px solid #fff; border-radius: 6px; }
.select-bar {
  border-top: 1px solid var(--card-line);
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.select-bar .in { max-width: 608px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.select-bar .cnt { flex: 1; font-weight: 600; }
.btn-del { appearance: none; border: 0; background: #e5484d; color: #fff; font: 600 .95rem var(--font-body); padding: 12px 18px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn-del[disabled] { opacity: .4; cursor: default; }
.btn-del svg { width: 16px; height: 16px; }
.btn-del:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.scroller {
  overflow-y: auto;
  min-height: 0;
  padding-block: 14px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.inner { max-width: 608px; margin: 0 auto; }
ul.tasks { position: relative; list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

/* Task row */
.task {
  position: relative;
  display: grid;
  grid-template-columns: 26px 32px 1fr 48px;
  align-items: center;
  column-gap: 8px;
  background: var(--card);
  border: 1px solid var(--card-line);
  border-radius: 14px;
  padding: 6px 2px 6px 4px;
  transition: opacity .35s ease, transform .35s ease, box-shadow .2s;
}
.grip {
  align-self: stretch;
  display: grid;
  place-items: center;
  cursor: grab;
  touch-action: none;
  color: #4a4a54;
  border-radius: 8px;
}
.grip svg { width: 10px; height: 18px; }
.grip:focus-visible { outline: 2px solid #fff; }
.age {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--card-2);
  color: var(--muted);
  font-size: .72rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.age.warn { background: rgba(240,164,41,.16); color: var(--warn); }
.age.alert { background: rgba(255,100,100,.16); color: var(--alert); }
.body {
  min-width: 0;
  padding-block: 8px;
  cursor: text;
  display: grid;
  gap: 2px;
}
.body .text { overflow-wrap: anywhere; color: var(--text); }
.due { font-size: .8rem; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.due svg { width: 12px; height: 12px; flex: none; }
.due.soon { color: var(--warn); }
.due.over { color: var(--alert); }
.task > label { display: grid; place-items: center; width: 48px; height: 48px; cursor: pointer; }
.task input[type="checkbox"] {
  appearance: none;
  margin: 0;
  width: 26px;
  height: 26px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.task input[type="checkbox"]::after {
  content: "";
  width: 6px;
  height: 11px;
  border: solid #fff;
  border-width: 0 2.5px 2.5px 0;
  transform: translateY(-1px) rotate(45deg) scale(0);
  transition: transform .15s;
}
.task input[type="checkbox"]:checked { background: var(--accent); }
.task input[type="checkbox"]:checked::after { transform: translateY(-1px) rotate(45deg) scale(1); }
.task input[type="checkbox"]:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.task.done .text { text-decoration: line-through; color: var(--muted); }
.task.leaving { opacity: 0; transform: translateX(-24px); }
.task.dragging {
  z-index: 5;
  transition: box-shadow .2s;
  border-color: var(--accent);
  background: var(--card-2);
  box-shadow: 0 12px 30px rgba(0,0,0,.6);
}
.task.dragging .grip { color: var(--accent); cursor: grabbing; }

/* Editing card */
.task.editing {
  grid-template-columns: 1fr;
  padding: 14px;
  gap: 12px;
  border-color: var(--accent);
  background: var(--card-2);
}
.edit-text {
  width: 100%;
  font: 500 1.05rem var(--font-body);
  color: #fff;
  background: transparent;
  border: 0;
  border-bottom: 1px solid #3a3a44;
  padding: 4px 0 8px;
  border-radius: 0;
}
.edit-text:focus { outline: none; border-bottom-color: var(--accent); }
.edit-meta { font-size: .8rem; color: var(--muted); }
.edit-label { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  appearance: none;
  position: relative;
  border: 1px solid #34343c;
  background: transparent;
  color: #fff;
  font: 500 .85rem var(--font-body);
  padding: 7px 12px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip { white-space: nowrap; }
.chip svg { width: 12px; height: 12px; flex: none; }
.chip.on { background: var(--accent); border-color: var(--accent); }
.chip:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.chip input[type="date"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  cursor: pointer;
}
.edit-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-ghost {
  appearance: none;
  background: none;
  border: 0;
  color: #fff;
  font: 600 .9rem var(--font-body);
  padding: 9px 4px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-ghost .sw { width: 10px; height: 10px; border-radius: 50%; }
.btn-move {
  appearance: none; border: 0; color: #fff; background: var(--move, var(--later));
  font: 600 .9rem var(--font-body); padding: 10px 16px; border-radius: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-move svg { width: 14px; height: 14px; }
.btn-move:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.btn-solid {
  appearance: none;
  border: 0;
  background: #fff;
  color: #000;
  font: 600 .9rem var(--font-body);
  padding: 10px 20px;
  border-radius: 12px;
  cursor: pointer;
}
.btn-ghost:focus-visible, .btn-solid:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.empty { margin-top: 36px; text-align: center; color: var(--muted); display: grid; gap: 4px; justify-items: center; }
.empty strong { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; color: var(--text); }
.tip { font-size: .78rem; color: var(--muted); text-align: center; padding-top: 14px; }
.status { font-size: .75rem; color: var(--muted); text-align: center; padding-top: 6px; }

/* Composer */
.composer-wrap {
  border-top: 1px solid var(--card-line);
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
form.composer { max-width: 608px; margin: 0 auto; display: flex; gap: 8px; }
form.composer input {
  flex: 1;
  min-width: 0;
  font: 400 1rem var(--font-body);
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--card-line);
  border-radius: 14px;
  padding: 13px 16px;
}
form.composer input::placeholder { color: var(--muted); }
form.composer input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
form.composer button {
  flex: none;
  width: 50px;
  font: 600 1.6rem/1 var(--font-body);
  color: #fff;
  background: var(--accent);
  border: 0;
  border-radius: 14px;
  cursor: pointer;
}
form.composer button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(88px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 12px);
  display: flex;
  align-items: center;
  gap: 14px;
  max-width: calc(100% - 32px);
  padding: 10px 10px 10px 16px;
  border-radius: 14px;
  background: #fff;
  color: #000;
  font-size: .9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 30;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button {
  flex: none;
  background: #000;
  border: 0;
  color: #fff;
  border-radius: 9px;
  padding: 7px 14px;
  font: 600 .85rem var(--font-body);
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="head-inner">
      <div class="topline">
        <div class="brand">
          <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="26" fill="#000"/><path d="M50 18a32 32 0 0 0 0 64z" fill="#d9480f"/><path d="M50 18a32 32 0 0 1 0 64z" fill="#3651cc"/><path d="M35 51l10 10 20-22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h1>todo</h1>
        </div>
        <div class="done-pill" id="done-pill" title="Tasks you completed today. Resets at midnight.">
          <span class="num" id="done-num">0</span><span>done today</span>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-short" data-list="short" aria-selected="true" aria-controls="pane-short">Short term <span class="count" id="count-short">0</span></button>
        <button class="tab" role="tab" id="tab-long" data-list="long" aria-selected="false" aria-controls="pane-long">Long term <span class="count" id="count-long">0</span></button>
        <button class="tab" role="tab" id="tab-done" data-list="done" aria-selected="false" aria-controls="pane-done">Done <span class="count" id="count-done">0</span></button>
        <span class="indicator" id="indicator"></span>
      </div>
    </div>
  </header>

  <main class="track" id="track">
    <section class="pane" data-list="short" id="pane-short" role="tabpanel" aria-labelledby="tab-short">
      <div class="scroller"><div class="inner">
        <ul class="tasks" id="list-short"></ul>
        <div class="tip" id="tip-short">Tap a task to edit · drag the dots to reorder</div>
        <div class="status" id="status-short"></div>
      </div></div>
      <div class="composer-wrap">
        <form class="composer" data-list="short">
          <input id="new-short" type="text" placeholder="Add a short-term task" autocomplete="off" enterkeyhint="done" aria-label="New short-term task">
          <button type="submit" aria-label="Add task">+</button>
        </form>
      </div>
    </section>

    <section class="pane" data-list="long" id="pane-long" role="tabpanel" aria-labelledby="tab-long">
      <div class="scroller"><div class="inner">
        <ul class="tasks" id="list-long"></ul>
        <div class="tip" id="tip-long">Tap a task to edit · drag the dots to reorder</div>
        <div class="status" id="status-long"></div>
      </div></div>
      <div class="composer-wrap">
        <form class="composer" data-list="long">
          <input id="new-long" type="text" placeholder="Add a long-term task" autocomplete="off" enterkeyhint="done" aria-label="New long-term task">
          <button type="submit" aria-label="Add task">+</button>
        </form>
      </div>
    </section>

    <section class="pane" data-list="done" id="pane-done" role="tabpanel" aria-labelledby="tab-done">
      <div class="scroller"><div class="inner" id="done-inner"></div></div>
      <div class="select-bar" id="select-bar" hidden>
        <div class="in">
          <button type="button" class="link-btn" id="sel-cancel">Cancel</button>
          <span class="cnt" id="sel-count">0 selected</span>
          <button type="button" class="link-btn" id="sel-all">Select all</button>
          <button type="button" class="btn-del" id="sel-delete" disabled>Delete</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-text">Done</span>
  <button type="button" id="undo">Undo</button>
</div>

<script>
(() => {
  const LS_TASKS = "todo.tasks.v2";
  const lists = ["short", "long"];
  const panes = ["short", "long", "done"];
  const names = { short: "Short term", long: "Long term" };
  const DAY = 86400000;

  let tasks = [];                 // {id, text, list, created, order, due}
  const leaving = new Set();
  let store = null;
  let mode = "loading";
  let edit = null;                // {id, text, due, list}
  let dragging = null;
  let renderPending = false;
  let freshId = null;

  const $ = (id) => document.getElementById(id);
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ---------- dates ----------
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const fromKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const startOf = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const todayKey = () => keyOf(new Date());
  const addDays = (n) => { const d = startOf(new Date()); d.setDate(d.getDate() + n); return keyOf(d); };
  const daysBetween = (a, b) => Math.round((startOf(b) - startOf(a)) / DAY);

  function ageInfo(t) {
    const days = Math.max(0, daysBetween(new Date(t.created), new Date()));
    let label;
    if (days === 0) label = "new";
    else if (days < 14) label = days + "d";
    else if (days < 60) label = Math.floor(days / 7) + "w";
    else label = Math.floor(days / 30) + "mo";
    const [warnAt, alertAt] = t.list === "short" ? [3, 7] : [60, 180];
    const cls = days >= alertAt ? "alert" : days >= warnAt ? "warn" : "";
    const full = days === 0 ? "Added today" : "Pending " + days + (days === 1 ? " day" : " days");
    return { label, cls, full, days };
  }

  function dueInfo(due) {
    if (!due) return null;
    const diff = daysBetween(new Date(), fromKey(due));
    if (diff < 0) return { text: "Overdue " + (-diff) + "d", cls: "over" };
    if (diff === 0) return { text: "Due today", cls: "soon" };
    if (diff === 1) return { text: "Due tomorrow", cls: "soon" };
    const d = fromKey(due);
    if (diff < 7) return { text: "Due " + d.toLocaleDateString(undefined, { weekday: "long" }), cls: "" };
    return { text: "Due " + d.toLocaleDateString(undefined, { day: "numeric", month: "short" }), cls: "" };
  }

  function dueChoices() {
    const dow = new Date().getDay();
    const toSat = dow === 6 ? 0 : (6 - dow + 7) % 7;
    const toMon = ((8 - dow) % 7) || 7;
    return [
      { label: "Today", key: addDays(0) },
      { label: "Tomorrow", key: addDays(1) },
      { label: "Weekend", key: addDays(toSat) },
      { label: "Next week", key: addDays(toMon) },
    ];
  }

  // ---------- local storage ----------
  function readLocal() {
    try { const v = JSON.parse(localStorage.getItem(LS_TASKS) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; }
  }
  function writeLocal() { try { localStorage.setItem(LS_TASKS, JSON.stringify(tasks)); } catch {} }

  const localStore = {
    put(t) { tasks = tasks.filter(x => x.id !== t.id).concat(t); writeLocal(); render(); },
    putMany(ts) { const ids = new Set(ts.map(t => t.id)); tasks = tasks.filter(x => !ids.has(x.id)).concat(ts); writeLocal(); render(); },
    remove(id) { tasks = tasks.filter(t => t.id !== id); writeLocal(); render(); },
    removeMany(ids) { const s = new Set(ids); tasks = tasks.filter(t => !s.has(t.id)); writeLocal(); render(); },
  };

  // ---------- render ----------
  const sorted = (list) => tasks.filter(t => t.list === list)
    .sort((a, b) => (a.order ?? a.created) - (b.order ?? b.created) || a.created - b.created);

  let selecting = false;
  const selected = new Set();
  const restoreSvg = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8h8a4 4 0 0 1 0 8H8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7 4.5 3.5 8 7 11.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const trashSvg = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M5 5.5l.8 10.6a1.5 1.5 0 0 0 1.5 1.4h5.4a1.5 1.5 0 0 0 1.5-1.4L15 5.5M8.5 9v5M11.5 9v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function putBack(items) {
    const maxOrder = Math.max(-1, ...sorted("short").map(x => x.order ?? 0));
    const back = items.map((t, i) => { const { from, completedAt, ...rest } = t; return { ...rest, list: "short", order: maxOrder + 1 + i }; });
    store.putMany(back);
    toast(items.length === 1 ? "Back in Short term: " + items[0].text : items.length + " tasks back in Short term", () => store.putMany(items));
  }
  function deleteDone(items) {
    store.removeMany(items.map(t => t.id));
    toast(items.length === 1 ? "Deleted: " + items[0].text : "Deleted " + items.length + " tasks", () => store.putMany(items));
  }
  function purgeOld() {
    const cutoff = Date.now() - 90 * DAY;
    const old = tasks.filter(t => t.list === "done" && (t.completedAt || 0) < cutoff).map(t => t.id);
    if (old.length) store.removeMany(old);
  }

  const doneItems = () => tasks.filter(t => t.list === "done").sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
  const isToday = (ms) => keyOf(new Date(ms)) === todayKey();

  function renderDone() {
    const all = doneItems();
    const today = all.filter(t => isToday(t.completedAt)).length + leaving.size;
    $("done-num").textContent = today;
    $("count-done").textContent = all.length;
    const weekAgo = startOf(new Date()).getTime() - 6 * DAY;
    const week = all.filter(t => t.completedAt >= weekAgo).length;
    const wrap = $("done-inner");
    wrap.replaceChildren();
    const sum = document.createElement("div");
    sum.className = "summary";
    for (const [n, l] of [[today, "today"], [week + leaving.size, "last 7 days"], [all.length + leaving.size, "all time"]]) {
      const c = document.createElement("div"); c.className = "stat";
      const b = document.createElement("b"); b.textContent = n;
      const sp = document.createElement("span"); sp.textContent = l;
      c.append(b, sp); sum.append(c);
    }
    wrap.append(sum);
    $("pane-done").classList.toggle("selecting", selecting);
    $("select-bar").hidden = !selecting;
    if (selecting) {
      for (const id of [...selected]) if (!all.some(t => t.id === id)) selected.delete(id);
      $("sel-count").textContent = selected.size + " selected";
      $("sel-delete").disabled = selected.size === 0;
      $("sel-delete").innerHTML = trashSvg + (selected.size ? "Delete " + selected.size : "Delete");
      $("sel-all").textContent = selected.size === all.length && all.length ? "Select none" : "Select all";
    }
    if (all.length) {
      const tools = document.createElement("div"); tools.className = "done-tools";
      const note = document.createElement("span"); note.className = "note";
      note.textContent = selecting ? "Tap tasks to select them" : "Cleared automatically after 90 days";
      tools.append(note);
      if (!selecting) {
        const sb = document.createElement("button"); sb.type = "button"; sb.className = "link-btn"; sb.textContent = "Select";
        sb.addEventListener("click", () => { selecting = true; selected.clear(); renderDone(); });
        tools.append(sb);
      }
      wrap.append(tools);
    }
    if (!all.length) {
      if (selecting) { selecting = false; $("select-bar").hidden = true; $("pane-done").classList.remove("selecting"); }
      const e = document.createElement("div"); e.className = "empty";
      const s = document.createElement("strong"); s.textContent = "Nothing completed yet";
      const p = document.createElement("span"); p.textContent = "Tick a task's circle and it shows up here.";
      e.append(s, p); wrap.append(e); return;
    }
    let curKey = null, ul = null, head = null, n = 0;
    for (const t of all) {
      const d = new Date(t.completedAt);
      const k = keyOf(d);
      if (k !== curKey) {
        curKey = k; n = 0;
        const diff = daysBetween(d, new Date());
        head = document.createElement("div"); head.className = "day-head";
        const lab = document.createElement("span");
        lab.textContent = diff === 0 ? "Today" : diff === 1 ? "Yesterday" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
        head.append(lab, document.createElement("span"));
        ul = document.createElement("ul"); ul.className = "done-list";
        wrap.append(head, ul);
      }
      head.lastChild.textContent = ++n;
      const li = document.createElement("li"); li.className = "done-item" + (selecting && selected.has(t.id) ? " sel" : "");
      const tick = document.createElement("span"); tick.className = selecting ? "selbox" : "tick";
      const dt = document.createElement("div"); dt.className = "dt";
      const tx = document.createElement("span"); tx.className = "text"; tx.textContent = t.text;
      const meta = document.createElement("span"); meta.className = "meta";
      const sw = document.createElement("span"); sw.className = "sw";
      sw.style.background = t.from === "long" ? "var(--later)" : "var(--now)";
      const took = Math.max(0, daysBetween(new Date(t.created), d));
      meta.append(sw, (took === 0 ? "same day" : "took " + took + (took === 1 ? " day" : " days")) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }));
      dt.append(tx, meta);
      if (selecting) {
        li.append(tick, dt);
        li.setAttribute("role", "checkbox");
        li.setAttribute("aria-checked", String(selected.has(t.id)));
        li.tabIndex = 0;
        const toggle = () => { selected.has(t.id) ? selected.delete(t.id) : selected.add(t.id); renderDone(); };
        li.addEventListener("click", toggle);
        li.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });
      } else {
        const acts = document.createElement("div"); acts.className = "row-acts";
        const back = document.createElement("button");
        back.type = "button"; back.className = "icon-btn restore"; back.innerHTML = restoreSvg;
        back.setAttribute("aria-label", "Put back in Short term: " + t.text);
        back.title = "Put back in Short term";
        back.addEventListener("click", () => putBack([t]));
        const del = document.createElement("button");
        del.type = "button"; del.className = "icon-btn trash"; del.innerHTML = trashSvg;
        del.setAttribute("aria-label", "Delete: " + t.text);
        del.title = "Delete";
        del.addEventListener("click", () => deleteDone([t]));
        acts.append(back, del);
        li.append(tick, dt, acts);
      }
      ul.append(li);
    }
  }

  function render() {
    if (dragging) { renderPending = true; return; }
    const hadFocus = document.activeElement && document.activeElement.id === "edit-text";
    for (const list of lists) {
      const ul = $("list-" + list);
      const items = sorted(list);
      $("count-" + list).textContent = items.filter(t => !leaving.has(t.id)).length;
      $("tip-" + list).hidden = items.length === 0;
      ul.replaceChildren();
      if (!items.length) {
        const li = document.createElement("li");
        li.className = "empty";
        const s = document.createElement("strong");
        const p = document.createElement("span");
        if (mode === "loading") { s.textContent = "Loading your tasks"; p.textContent = "One moment."; }
        else if (list === "short") { s.textContent = "All clear"; p.textContent = "Add a task below."; }
        else { s.textContent = "No long-term tasks yet"; p.textContent = "Add goals and bigger plans below."; }
        li.append(s, p);
        ul.append(li);
        continue;
      }
      for (const t of items) ul.append(edit && edit.id === t.id ? editorEl(t) : taskEl(t));
    }
    renderDone();
    if (hadFocus && $("edit-text")) { const i = $("edit-text"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }

  const gripSvg = '<svg viewBox="0 0 10 18" aria-hidden="true"><g fill="currentColor"><circle cx="2" cy="3" r="1.6"/><circle cx="8" cy="3" r="1.6"/><circle cx="2" cy="9" r="1.6"/><circle cx="8" cy="9" r="1.6"/><circle cx="2" cy="15" r="1.6"/><circle cx="8" cy="15" r="1.6"/></g></svg>';
  const calSvg = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="2" width="10" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1 5h10M4 1v2M8 1v2" stroke="currentColor" stroke-width="1.4"/></svg>';

  function taskEl(t) {
    const li = document.createElement("li");
    li.className = "task" + (leaving.has(t.id) ? " done" : "") + (t.id === freshId ? " fresh" : "");
    li.dataset.id = t.id;

    const grip = document.createElement("span");
    grip.className = "grip";
    grip.innerHTML = gripSvg;
    grip.setAttribute("aria-label", "Drag to reorder");
    grip.addEventListener("pointerdown", (e) => startDrag(e, li, t.list));

    const a = ageInfo(t);
    const age = document.createElement("span");
    age.className = "age " + a.cls;
    age.textContent = a.label;
    age.title = a.full;
    age.setAttribute("aria-label", a.full);

    const body = document.createElement("div");
    body.className = "body";
    body.tabIndex = 0;
    body.setAttribute("role", "button");
    body.setAttribute("aria-label", "Edit: " + t.text);
    const text = document.createElement("span");
    text.className = "text";
    text.textContent = t.text;
    body.append(text);
    const d = dueInfo(t.due);
    if (d) {
      const due = document.createElement("span");
      due.className = "due " + d.cls;
      due.innerHTML = calSvg;
      due.append(d.text);
      body.append(due);
    }
    body.addEventListener("click", () => openEdit(t));
    body.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEdit(t); } });

    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.id = "cb-" + t.id;
    box.checked = leaving.has(t.id);
    box.setAttribute("aria-label", "Complete and remove: " + t.text);
    label.append(box);
    box.addEventListener("change", () => { if (box.checked) complete(t, li); });

    li.append(grip, age, body, label);
    return li;
  }

  // ---------- edit mode ----------
  function openEdit(t) {
    if (edit && edit.id !== t.id) saveEdit();
    edit = { id: t.id, text: t.text, due: t.due || null, list: t.list };
    render();
    const i = $("edit-text");
    if (i) {
      i.focus({ preventScroll: true });
      i.setSelectionRange(i.value.length, i.value.length);
      if (plugins.Keyboard) { try { plugins.Keyboard.show(); } catch {} }
      requestAnimationFrame(() => i.closest(".task").scrollIntoView({ block: "center", behavior: "smooth" }));
    }
  }

  function saveEdit() {
    if (!edit) return;
    const t = tasks.find(x => x.id === edit.id);
    const e = edit;
    edit = null;
    if (!t) { render(); return; }
    const text = (e.text || "").trim().slice(0, 500) || t.text;
    if (text !== t.text || (e.due || null) !== (t.due || null)) store.put({ ...t, text, due: e.due || null });
    else render();
  }

  function editorEl(t) {
    const li = document.createElement("li");
    li.className = "task editing";
    li.dataset.id = t.id;

    const input = document.createElement("input");
    input.type = "text";
    input.className = "edit-text";
    input.id = "edit-text";
    input.value = edit.text;
    input.setAttribute("aria-label", "Task text");
    input.enterKeyHint = "done";
    input.addEventListener("input", () => { edit.text = input.value; });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); saveEdit(); }
      if (e.key === "Escape") { edit = null; render(); }
    });

    const a = ageInfo(t);
    const meta = document.createElement("div");
    meta.className = "edit-meta";
    meta.textContent = a.full + " · added " + new Date(t.created).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });

    const dueLabel = document.createElement("div");
    dueLabel.className = "edit-label";
    dueLabel.textContent = "Due date";
    const chips = document.createElement("div");
    chips.className = "chips";
    const choices = dueChoices();
    let matched = false;
    for (const c of choices) {
      const b = document.createElement("button");
      b.type = "button";
      const on = edit.due === c.key && !matched;
      if (on) matched = true;
      b.className = "chip" + (on ? " on" : "");
      b.textContent = c.label;
      b.addEventListener("click", () => { edit.due = edit.due === c.key ? null : c.key; render(); });
      chips.append(b);
    }
    const pick = document.createElement("label");
    pick.className = "chip" + (edit.due && !matched ? " on" : "");
    pick.innerHTML = calSvg;
    pick.append(edit.due && !matched ? fromKey(edit.due).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "Pick date");
    const dateIn = document.createElement("input");
    dateIn.type = "date";
    dateIn.id = "edit-date";
    dateIn.value = edit.due || "";
    dateIn.setAttribute("aria-label", "Pick a due date");
    dateIn.addEventListener("change", () => { edit.due = dateIn.value || null; render(); });
    pick.append(dateIn);
    chips.append(pick);
    if (edit.due) {
      const clr = document.createElement("button");
      clr.type = "button";
      clr.className = "chip";
      clr.textContent = "No date";
      clr.addEventListener("click", () => { edit.due = null; render(); });
      chips.append(clr);
    }

    const foot = document.createElement("div");
    foot.className = "edit-foot";
    const other = t.list === "short" ? "long" : "short";
    const move = document.createElement("button");
    move.type = "button";
    move.className = "btn-move";
    move.style.setProperty("--move", other === "short" ? "var(--now)" : "var(--later)");
    move.innerHTML = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h9M7.5 3.5 11 7l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    move.append("Move to " + names[other]);
    move.addEventListener("click", () => {
      const text = (edit.text || "").trim().slice(0, 500) || t.text;
      const due = edit.due || null;
      edit = null;
      const maxOrder = Math.max(0, ...sorted(other).map(x => x.order ?? 0));
      store.put({ ...t, text, due, list: other, order: maxOrder + 1 });
      toast("Moved to " + names[other], false);
    });
    const done = document.createElement("button");
    done.type = "button";
    done.className = "btn-solid";
    done.textContent = "Save";
    done.addEventListener("click", saveEdit);
    foot.append(move, done);

    li.append(input, meta, dueLabel, chips, foot);
    return li;
  }

  // Tap outside the editor saves it.
  document.addEventListener("pointerdown", (e) => {
    if (!edit) return;
    const ed = document.querySelector(".task.editing");
    if (ed && !ed.contains(e.target)) saveEdit();
  }, true);

  // ---------- complete + undo ----------
  let toastTimer = null, undoFn = null;
  $("sel-cancel").addEventListener("click", () => { selecting = false; selected.clear(); renderDone(); });
  $("sel-all").addEventListener("click", () => {
    const all = doneItems();
    if (selected.size === all.length) selected.clear(); else all.forEach(t => selected.add(t.id));
    renderDone();
  });
  $("sel-delete").addEventListener("click", () => {
    const items = doneItems().filter(t => selected.has(t.id));
    if (!items.length) return;
    selecting = false; selected.clear();
    deleteDone(items);
  });
  function bump() { renderDone(); const p = $("done-pill"); p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump"); }
  function complete(t, li) {
    leaving.add(t.id);
    li.classList.add("done");
    $("count-" + t.list).textContent = Math.max(0, Number($("count-" + t.list).textContent) - 1);
    setTimeout(() => li.classList.add("leaving"), 250);
    setTimeout(() => { if (leaving.delete(t.id)) store.put({ ...t, list: "done", from: t.list, completedAt: Date.now(), due: t.due || null }); }, 600);
    bump();
    toast("Done: " + t.text, () => { leaving.delete(t.id); store.put(t); });
  }
  function toast(msg, undo) {
    $("toast-text").textContent = msg;
    undoFn = typeof undo === "function" ? undo : null;
    $("undo").hidden = !undoFn;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").classList.remove("show"); undoFn = null; }, 4500);
  }
  $("undo").addEventListener("click", () => {
    const fn = undoFn; undoFn = null;
    $("toast").classList.remove("show");
    if (fn) fn();
  });

  // ---------- drag to reorder ----------
  function startDrag(e, li, list) {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    e.preventDefault();
    if (edit) saveEdit();
    const ul = li.parentElement;
    const scroller = ul.closest(".scroller");
    dragging = { li, ul, list, scroller, startY: e.clientY, y: e.clientY, baseTop: li.offsetTop, startScroll: scroller.scrollTop, raf: 0 };
    li.classList.add("dragging");
    $("track").classList.add("locked");
    try { li.setPointerCapture(e.pointerId); } catch {}
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch {} }
    li.addEventListener("pointermove", onDragMove);
    li.addEventListener("pointerup", endDrag);
    li.addEventListener("pointercancel", endDrag);
    autoScroll();
  }
  function placeDrag() {
    const d = dragging; if (!d) return;
    const desired = d.baseTop + (d.y - d.startY) + (d.scroller.scrollTop - d.startScroll);
    const center = desired + d.li.offsetHeight / 2;
    const prev = d.li.previousElementSibling, next = d.li.nextElementSibling;
    if (prev && center < prev.offsetTop + prev.offsetHeight / 2) d.ul.insertBefore(d.li, prev);
    else if (next && center > next.offsetTop + next.offsetHeight / 2) d.ul.insertBefore(next, d.li);
    d.li.style.transform = `translateY(${desired - d.li.offsetTop}px)`;
  }
  function onDragMove(e) { if (!dragging) return; dragging.y = e.clientY; placeDrag(); }
  function autoScroll() {
    const d = dragging; if (!d) return;
    const r = d.scroller.getBoundingClientRect();
    const edge = 56;
    let v = 0;
    if (d.y < r.top + edge) v = -Math.ceil((r.top + edge - d.y) / 6);
    else if (d.y > r.bottom - edge) v = Math.ceil((d.y - (r.bottom - edge)) / 6);
    if (v) { d.scroller.scrollTop += v; placeDrag(); }
    d.raf = requestAnimationFrame(autoScroll);
  }
  function endDrag() {
    const d = dragging; if (!d) return;
    cancelAnimationFrame(d.raf);
    d.li.removeEventListener("pointermove", onDragMove);
    d.li.removeEventListener("pointerup", endDrag);
    d.li.removeEventListener("pointercancel", endDrag);
    d.li.classList.remove("dragging");
    d.li.style.transform = "";
    $("track").classList.remove("locked");
    dragging = null;
    const ids = [...d.ul.querySelectorAll(".task")].map(el => el.dataset.id);
    const changed = [];
    ids.forEach((id, i) => {
      const t = tasks.find(x => x.id === id);
      if (t && t.order !== i) changed.push({ ...t, order: i });
    });
    if (changed.length) store.putMany(changed);
    else if (renderPending) render();
    renderPending = false;
  }
  document.addEventListener("touchmove", (e) => { if (dragging) e.preventDefault(); }, { passive: false });

  // ---------- add ----------
  document.querySelectorAll("form.composer").forEach(form => {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const input = form.querySelector("input");
      const text = input.value.trim();
      if (!text || !store) return;
      const list = form.dataset.list;
      const maxOrder = Math.max(-1, ...sorted(list).map(x => x.order ?? 0));
      const id = newId();
      freshId = id;
      setTimeout(() => { if (freshId === id) { freshId = null; const el = document.querySelector('.task.fresh'); if (el) el.classList.remove("fresh"); } }, 1600);
      store.put({ id, text: text.slice(0, 500), list, created: Date.now(), order: maxOrder + 1, due: null });
      input.value = "";
      input.focus();
      const sc = form.closest(".pane").querySelector(".scroller");
      requestAnimationFrame(() => sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" }));
    });
  });

  // ---------- tabs, swipe, header colour ----------
  const track = $("track");
  const canMix = !!(window.CSS && CSS.supports && CSS.supports("color", "color-mix(in srgb, red 50%, blue)"));
  function onScroll() {
    const r = Math.min(2, Math.max(0, track.scrollLeft / Math.max(1, track.clientWidth)));
    $("indicator").style.transform = `translateX(${r * 100}%)`;
    const head = r <= 1
      ? `color-mix(in srgb, var(--later) ${Math.round(r * 100)}%, var(--now))`
      : `color-mix(in srgb, var(--done) ${Math.round((r - 1) * 100)}%, var(--later))`;
    document.documentElement.style.setProperty("--head", canMix ? head : ["#d9480f", "#3651cc", "#1f9d55"][Math.round(r)]);
    panes.forEach((l, i) => $("tab-" + l).setAttribute("aria-selected", String(Math.round(r) === i)));
  }
  track.addEventListener("scroll", onScroll, { passive: true });
  panes.forEach((l, i) => $("tab-" + l).addEventListener("click", () => {
    if (edit) saveEdit();
    track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" });
  }));
  document.addEventListener("keydown", (e) => {
    if (edit || dragging || e.target.tagName === "INPUT") return;
    const cur = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    if (e.key === "ArrowRight") track.scrollTo({ left: Math.min(2, cur + 1) * track.clientWidth, behavior: "smooth" });
    if (e.key === "ArrowLeft") track.scrollTo({ left: Math.max(0, cur - 1) * track.clientWidth, behavior: "smooth" });
  });
  // Refresh ages and due labels when the day changes or the app comes back.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !edit) render(); });

  // ---------- startup (Android app: everything is stored on this phone) ----------
  function setStatus(msg) { lists.forEach(l => $("status-" + l).textContent = msg); }
  const Cap = window.Capacitor;
  const plugins = (Cap && Cap.Plugins) || {};

  function currentPane() { return Math.round(track.scrollLeft / Math.max(1, track.clientWidth)); }
  function syncStatusBar() {
    if (!plugins.StatusBar) return;
    const colors = ["#d9480f", "#3651cc", "#1f9d55"];
    try { plugins.StatusBar.setBackgroundColor({ color: colors[currentPane()] || colors[0] }); } catch {}
  }
  let sbTimer = null;
  track.addEventListener("scroll", () => { clearTimeout(sbTimer); sbTimer = setTimeout(syncStatusBar, 80); }, { passive: true });

  // ---------- keyboard ----------
  // Android 15 draws the keyboard over the app instead of shrinking it, so the app
  // shrinks itself by however much of the keyboard is still covering it.
  const Keyboard = plugins.Keyboard;
  let baseHeight = window.innerHeight;
  let kbOpen = false;
  let kbReported = 0;

  function applyKeyboard() {
    let cover = 0;
    if (kbOpen) {
      const shrunk = Math.max(0, baseHeight - window.innerHeight);
      const vv = window.visualViewport ? Math.max(0, window.innerHeight - window.visualViewport.height) : 0;
      cover = Math.max(0, kbReported - shrunk, vv);
    }
    document.documentElement.style.setProperty("--kb", cover + "px");
    if (kbOpen) requestAnimationFrame(keepFocusedVisible);
  }
  function keepFocusedVisible() {
    const a = document.activeElement;
    if (!a) return;
    if (a.id === "edit-text") {
      const card = a.closest(".task");
      if (card) card.scrollIntoView({ block: "center", behavior: "smooth" });
    } else if (a.closest && a.closest("form.composer")) {
      const sc = a.closest(".pane").querySelector(".scroller");
      sc.scrollTop = sc.scrollHeight;
    }
  }
  function typingInput() {
    const a = document.activeElement;
    return a && a.tagName === "INPUT" && (a.type === "text" || a.type === "date") ? a : null;
  }
  function hideKeyboard() {
    const a = typingInput();
    if (a) a.blur();
    if (Keyboard) { try { Keyboard.hide(); } catch {} }
  }
  function openKeyboardFor(list) {
    const input = $("new-" + list);
    if (!input || edit || selecting) return;
    input.focus({ preventScroll: true });
    if (Keyboard) { try { Keyboard.show(); } catch {} }
  }

  if (Keyboard) {
    Keyboard.addListener("keyboardWillShow", (info) => { kbOpen = true; kbReported = (info && info.keyboardHeight) || 0; applyKeyboard(); });
    Keyboard.addListener("keyboardDidShow", (info) => { kbOpen = true; kbReported = (info && info.keyboardHeight) || kbReported; applyKeyboard(); });
    Keyboard.addListener("keyboardWillHide", () => { kbOpen = false; applyKeyboard(); });
    Keyboard.addListener("keyboardDidHide", () => { kbOpen = false; applyKeyboard(); });
  }
  // Browsers and phones where the page itself shrinks or the visual viewport reports the keyboard.
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", () => {
      if (!Keyboard) kbOpen = window.innerHeight - window.visualViewport.height > 80 || baseHeight - window.innerHeight > 80;
      applyKeyboard();
    });
  }
  window.addEventListener("resize", () => {
    if (!kbOpen && !typingInput()) baseHeight = window.innerHeight;
    else if (window.innerHeight > baseHeight) baseHeight = window.innerHeight;
    applyKeyboard();
  });
  document.addEventListener("focusin", () => { if (kbOpen) requestAnimationFrame(keepFocusedVisible); });

  // Tap empty space, tap the top bar, or start scrolling the list: the keyboard closes.
  document.querySelectorAll(".scroller").forEach(sc => {
    sc.addEventListener("pointerdown", (e) => {
      if (!typingInput()) return;
      if (e.target.closest(".task, button, input, label, .done-item, .chip")) return;
      hideKeyboard();
    });
    let sy = null;
    sc.addEventListener("touchstart", (e) => { sy = e.touches[0].clientY; }, { passive: true });
    sc.addEventListener("touchmove", (e) => {
      if (sy === null || dragging || !typingInput() || document.activeElement.id === "edit-text") return;
      if (Math.abs(e.touches[0].clientY - sy) > 12) { sy = null; hideKeyboard(); }
    }, { passive: true });
  });
  document.querySelector("header").addEventListener("pointerdown", (e) => {
    if (typingInput() && !e.target.closest(".tab")) hideKeyboard();
  });

  function start() {
    mode = "local";
    store = localStore;
    tasks = readLocal();
    setStatus("");
    render();
    purgeOld();
    if (plugins.StatusBar) {
      try { plugins.StatusBar.setStyle({ style: "DARK" }); } catch {}
      syncStatusBar();
    }
    // Open on Short term, ready to type.
    setTimeout(() => openKeyboardFor("short"), 350);
    if (plugins.App) {
      plugins.App.addListener("backButton", () => {
        if (kbOpen || typingInput()) { if (edit) { edit = null; render(); } hideKeyboard(); return; }
        if (edit) { edit = null; render(); return; }
        if (selecting) { selecting = false; selected.clear(); renderDone(); return; }
        const cur = currentPane();
        if (cur > 0) { track.scrollTo({ left: (cur - 1) * track.clientWidth, behavior: "smooth" }); return; }
        plugins.App.exitApp();
      });
      plugins.App.addListener("resume", () => {
        if (!edit && !dragging) { render(); purgeOld(); }
        const cur = currentPane();
        if (cur < 2) setTimeout(() => openKeyboardFor(lists[cur]), 250);
      });
    }
  }
  start();
})();
</script>
</body>
</html>
